<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/datos_style.css">
</head>
<body>
    <!--Navegador superior para pantallas pequeñas-->
    <nav class="superior" id="navbar">
        <div class="logo">
            <h4>Laura<br>Rebolo</h4>
        </div>

        <ul>
            <div class="nav-item"><a href="../index.html">Proyectos</a></div>
            <div class="nav-item"><a href="sobre-mi.html">Sobre mí</a></div>
            <a href="contacto.html"><button class="button">Contactar</button></a>
        </ul>
    </nav>

    <!-- Navegador lateral estatico -->
    <nav class="columna-izquierda" id="sidebar">
        <div class="logo">
            <h4>Laura<br>Rebolo</h4>
        </div>

        <ul>
            <div class="nav-item"><a href="../index.html">Proyectos</a></div>
            <div class="nav-item"><a href="sobre-mi.html">Sobre mí</a></div>
            <a href="contacto.html"><button class="button">Contactar</button></a>
        </ul>
    </nav>

    <main class="columna-derecha">
        <div class="formulario">
            <form id="contactForm">
                <div class="box" id="titulo" style="grid-area: box-1">
                    <h3>Contacto</h3>
                </div>
                <div class="box" id="asunto" style="grid-area: box-2">
                    <label for="subject">Asunto</label>
                    <input type="text" id="subject" required>
                </div>

                <div class="box" id="mensaje" style="grid-area: box-3">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="4" required></textarea>
                </div>

                <div class="box" id="boton" style="grid-area: box-4">
                    <button class="button" type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/random.js"></script>
</body>
</html>
